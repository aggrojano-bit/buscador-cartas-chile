# =============================================================
#  Ajustes del Buscador de Cartas Chile
#  Edita este archivo con el Bloc de notas y luego reinicia la app
#  (cierra la ventana negra y vuelve a abrir iniciar.bat).
#  Las líneas que empiezan con # son comentarios y no hacen nada.
# =============================================================

[general]
# Puerto donde se abre la app en tu PC: http://localhost:8001
# (si está ocupado por otro programa, cambia este número por uno libre)
puerto = 8001

# Moneda que se muestra al abrir la app: "CLP", "USD", "EUR" o "JPY"
moneda_por_defecto = "CLP"

# Repositorio público del proyecto: lo usa el botón "Reportar un error"
repositorio = "https://github.com/aggrojano-bit/buscador-cartas-chile"

# Los datos privados (token de CardTrader y correo de contacto) NO van aquí:
# van en el archivo .env, que nunca se sube a GitHub. Copia .env.example como .env.

# (Opcional) Carpeta donde se guarda la caché y el carrito.
# Vacío = %LOCALAPPDATA%\BuscadorCartasChile (fuera de OneDrive, recomendado).
carpeta_datos = ""

[cache]
# Cuántas horas se guardan los datos de Scryfall (ediciones e imágenes).
horas_catalogo = 24

# Cuántas horas se guardan los precios de las tiendas antes de volver a consultarlas.
# El botón "Actualizar precios" las consulta de nuevo en cualquier momento.
horas_precios_tiendas = 6

# Cada cuántas horas se vuelve a consultar el tipo de cambio.
horas_tipo_cambio = 6

# =============================================================
#  Costo estimado "puesto en Chile" (tiendas internacionales)
#  Es una ESTIMACIÓN: revisa el valor real al pagar en cada tienda.
# =============================================================
[importacion]
# IVA 19%: desde el 25-10-2025 se cobra en TODA compra internacional, sin importar el monto.
iva = 0.19
# Arancel (derecho ad valorem). Según las fuentes, las compras ocasionales de personas
# de hasta US$500 no pagan arancel; sobre ese monto se paga 6%.
# Si quieres ser conservador, cambia arancel_bajo_limite a 0.06.
arancel_bajo_limite = 0.0
arancel_sobre_limite = 0.06
limite_usd = 500
# Cobro fijo extra por pedido (trámite de aduana del courier o Correos), en pesos chilenos.
cargo_fijo_clp = 0

# Envío a Chile por pedido, en la moneda indicada. Es el valor inicial del carrito:
# ahí se puede cambiar para cada tienda (las tiendas chilenas parten en 0).
[envio.cardkingdom]
moneda = "USD"
costo = 25.0      # Card Kingdom no publica tarifas a Chile: ajústalo con el valor real de su checkout

[envio.hareruya]
moneda = "USD"
costo = 6.0       # envío básico por compra

[envio.cardtrader]
moneda = "EUR"
costo = 33.40     # CardTrader Zero, UPS Express Saver hasta 1 kg (~494 cartas)

[envio.tcgplayer]
moneda = "USD"
costo = 0.0       # sin dato: TCGplayer es un marketplace y el envío a Chile depende del vendedor (ajústalo en el carrito)

[envio.starcitygames]
moneda = "USD"
costo = 0.0       # sin dato: revisa el valor real en su checkout y ajústalo en el carrito

[peticiones]
# Pausa mínima (en segundos) entre dos peticiones al mismo sitio.
# Scryfall pide entre 0,05 y 0,1 segundos.
pausa_scryfall = 0.1
pausa_tiendas = 1.5

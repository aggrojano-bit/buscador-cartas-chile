# =============================================================
#  Ajustes del Buscador de Cartas Chile
#  Edita este archivo con el Bloc de notas y luego reinicia la app
#  (cierra la ventana negra y vuelve a abrir iniciar.bat).
#  Las líneas que empiezan con # son comentarios y no hacen nada.
# =============================================================

[general]
# Puerto donde se abre la app: http://localhost:8001
# (el 8000 lo usa tu bot de trading; si cambias este número, usa uno libre)
puerto = 8001

# Moneda que se muestra al abrir la app: "CLP", "USD", "EUR" o "JPY"
moneda_por_defecto = "CLP"

# (Opcional) Tu correo. Se agrega al "User-Agent" para que las tiendas
# sepan quién las consulta y puedan contactarte si algo les molesta.
# Déjalo vacío ("") si prefieres no enviarlo.
contacto = ""

# (Opcional) Carpeta donde se guarda la caché y el carrito.
# Vacío = %LOCALAPPDATA%\BuscadorCartasChile (fuera de OneDrive, recomendado).
carpeta_datos = ""

[cache]
# Cuántas horas se guardan los datos de Scryfall (ediciones e imágenes).
horas_catalogo = 24

# Cada cuántas horas se vuelve a consultar el tipo de cambio.
horas_tipo_cambio = 6

[peticiones]
# Pausa mínima (en segundos) entre dos peticiones al mismo sitio.
# Scryfall pide entre 0,05 y 0,1 segundos.
pausa_scryfall = 0.1
pausa_tiendas = 1.5

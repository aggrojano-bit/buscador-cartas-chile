name: 🐞 Reportar un error
description: Algo no funciona como debería en la página.
title: "[Error] "
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por avisar! Mientras más detalles nos des, más fácil es arreglarlo.
        No necesitas saber programar para completar esto.
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Describe el problema con tus palabras.
      placeholder: "Ejemplo: al buscar «Sol Ring» la página se quedó cargando y nunca mostró precios."
    validations:
      required: true
  - type: textarea
    id: que-esperaba
    attributes:
      label: ¿Qué esperabas que pasara?
      placeholder: "Ejemplo: que aparecieran las ofertas de las tiendas."
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para repetirlo
      description: Lo que hiciste, en orden, para que el error vuelva a aparecer.
      placeholder: |
        1. Entré a la página
        2. Escribí «Sol Ring» y elegí la sugerencia
        3. Hice clic en la edición Commander Masters
        4. ...
    validations:
      required: true
  - type: input
    id: carta
    attributes:
      label: Carta que estabas buscando (si aplica)
      placeholder: "Ejemplo: Lightning Bolt"
  - type: dropdown
    id: dispositivo
    attributes:
      label: Dispositivo
      options:
        - PC / notebook
        - Celular
        - Tablet
    validations:
      required: true
  - type: dropdown
    id: navegador
    attributes:
      label: Navegador
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Otro
    validations:
      required: true
  - type: textarea
    id: capturas
    attributes:
      label: Capturas de pantalla
      description: Si puedes, arrastra aquí una o más capturas. Ayudan muchísimo.
